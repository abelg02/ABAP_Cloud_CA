# Análisis estático del código ABAP con abaplint (sintaxis, tipos, diccionario y SQL de ABAP Cloud)
name: abaplint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @abaplint/cli@2 abaplint.json
